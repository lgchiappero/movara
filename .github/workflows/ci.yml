name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Todo lo de acá es de prueba: base local del runner, secretos ficticios y el
# proyecto público de Sanity (solo lectura). Nada apunta a producción.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/movara_ci
  NEXTAUTH_SECRET: ci-secret-solo-para-tests-0000000000000000
  AUTH_SECRET: ci-secret-solo-para-tests-0000000000000000
  NEXT_PUBLIC_WHATSAPP_NUMBER: "5491100000000"
  NEXT_PUBLIC_SANITY_PROJECT_ID: 6lavhw7y
  NEXT_PUBLIC_SANITY_DATASET: production

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # postinstall corre `prisma generate`, que necesita DATABASE_URL (no se conecta).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests con cobertura
        run: npm run test -- --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: movara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d movara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_INITIAL_EMAIL: e2e-admin@example.com
      ADMIN_INITIAL_PASSWORD: E2eAdminCI-solo-pruebas-123
      ADMIN_BOOTSTRAP_SECRET: ci-bootstrap-solo-pruebas
      CRON_SECRET: ci-cron-solo-pruebas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrar la base de prueba
        run: npx prisma migrate deploy

      - name: Sembrar el admin de prueba
        run: npx tsx scripts/seed-admin-e2e.ts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
